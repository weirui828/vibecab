[package]
name = "vcab"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
# sqlx-postgres 0.9.0 disables whoami's std feature, so URLs without a user
# connect as "anonymous". Enabling it restores the OS login as the default role.
whoami = { version = "2", default-features = false, features = ["std"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
